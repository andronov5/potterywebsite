<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Contact form</title></head>
  <body>
    <!-- Netlify detects the fields at build time; the visible form is on /about. -->
    <form name="pottery-contact" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="pottery-contact">
      <input name="name" type="text">
      <input name="email" type="email">
      <input name="topic" type="text">
      <textarea name="message"></textarea>
      <input name="website" type="text">
    </form>
  </body>
</html>
